server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # fotos de produto ja chegam reduzidas pelo painel (limite da API: 4 MB)
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # nome do servico com prefixo: o container tambem fica na rede easypanel,
  # onde um "api" generico poderia apontar para outro projeto
  location /api/ {
    proxy_pass http://doutorcelular-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store";
  }

  location /uploads/ {
    proxy_pass http://doutorcelular-api:3000;
    proxy_set_header Host $host;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # navegacao da loja e por #hash, entao tudo cai no index.html
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
